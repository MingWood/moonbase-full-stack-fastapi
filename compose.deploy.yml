services:

  backend:
    restart: always
    # nginx runs outside Docker on the EC2 host, terminates TLS, and reverse
    # proxies to this port. Bound to loopback only - not reachable from the
    # public internet directly, only via nginx.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
